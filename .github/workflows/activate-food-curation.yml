name: Activate curated restaurants
on:
  push:
    paths:
      - 'food-curation.js'
      - '.github/workflows/activate-food-curation.yml'
permissions:
  contents: write
jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate curated food data
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='  <script src="email-itinerary-hotfix.js"></script>\n'
          add='  <script src="food-curation.js"></script>\n'
          if add not in s:
              s=s.replace(marker, marker+add)
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("const CACHE_NAME = 'bali-2026-v7';","const CACHE_NAME = 'bali-2026-v8';")
          marker="  './email-itinerary-hotfix.js',\n"
          add="  './food-curation.js',\n"
          if add not in s:
              s=s.replace(marker,marker+add)
          p.write_text(s)
          PY
      - name: Commit activation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git commit -m "Activate curated restaurant plan [skip ci]" || true
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/activate-food-curation.yml
          git commit -m "Remove restaurant activation workflow [skip ci]"
          git push
