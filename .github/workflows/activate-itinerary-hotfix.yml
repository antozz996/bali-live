name: Activate itinerary hotfix

on:
  push:
    paths:
      - '.github/workflows/activate-itinerary-hotfix.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire hotfix into app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '  <script src="email-data.js"></script>\n'
          include = '  <script src="email-itinerary-hotfix.js"></script>\n'
          if include not in text:
              if marker not in text:
                  raise SystemExit('email-data.js marker not found')
              text = text.replace(marker, marker + include, 1)
          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace("const CACHE_NAME = 'bali-2026-v6';", "const CACHE_NAME = 'bali-2026-v7';")
          asset = "  './email-itinerary-hotfix.js',\n"
          if asset not in text:
              marker = "  './email-data.js',\n"
              if marker not in text:
                  raise SystemExit('email-data.js cache marker not found')
              text = text.replace(marker, marker + asset, 1)
          sw.write_text(text, encoding='utf-8')
          PY

      - name: Commit activation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Activate itinerary hotfix [skip ci]" || true
          git push

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/activate-itinerary-hotfix.yml
          git commit -m "Remove itinerary hotfix workflow [skip ci]" || true
          git push
