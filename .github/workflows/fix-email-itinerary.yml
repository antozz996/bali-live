name: Fix mail itinerary migration

on:
  push:
    paths:
      - '.github/workflows/fix-email-itinerary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch itinerary merge to use dayNum
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('email-data.js')
          s = p.read_text(encoding='utf-8')
          old = "      mergeStoredById('bali_itinerary_v1', data.itinerary);"
          new = """      (() => {
        let current = [];
        try {
          const parsed = JSON.parse(localStorage.getItem('bali_itinerary_v1') || 'null');
          if (Array.isArray(parsed)) current = parsed;
        } catch {}
        if (!current.length) current = (data.itinerary || []).map(item => ({ ...item }));
        const verifiedByDay = new Map((data.itinerary || []).map(item => [Number(item.dayNum), item]));
        current = current.map(item => verifiedByDay.has(Number(item.dayNum)) ? { ...item, ...verifiedByDay.get(Number(item.dayNum)) } : item);
        const present = new Set(current.map(item => Number(item.dayNum)));
        (data.itinerary || []).forEach(item => { if (!present.has(Number(item.dayNum))) current.push({ ...item }); });
        current.sort((a, b) => Number(a.dayNum) - Number(b.dayNum));
        localStorage.setItem('bali_itinerary_v1', JSON.stringify(current));
      })();"""
          if old not in s:
              raise SystemExit('target itinerary merge line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-data.js
          git commit -m "Fix mail itinerary migration [skip ci]"
          git push

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-email-itinerary.yml
          git commit -m "Remove mail itinerary fix workflow [skip ci]"
          git push
